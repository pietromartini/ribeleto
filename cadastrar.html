        </div>

<form id="cadastro-form">
<section class="cadastro-all">
<div class="campo-left">
    <p class="cadastro-title">Cadastro</p>
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Nome do Usuário</p>
    <input type="text" id="nome" placeholder="Nome..." class="input-cadastro" required minlength="4">
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Data de Nascimento</p>
    <input type="text" id="data-nascimento" placeholder="00/00/0000" class="input-cadastro" maxlength="10" required>
    </div>
</div>

<div class="campo-center">
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">CPF</p>
    <input type="text" id="cpf" placeholder="999.999.999-99" class="input-cadastro" maxlength="14" required>
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">CEP</p>
    <input type="text" id="cep" placeholder="99999-999" class="input-cadastro" maxlength="9" required>
    </div>
</div>

<div class="campo-right">
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Telefone</p>
    <input type="text" id="telefone" placeholder="(99)99999-9999" class="input-cadastro" maxlength="15" required>
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Senha</p>
    <input type="text" id="senha" placeholder="Senha" class="input-cadastro" minlength="4" required>
    <button class="btn-confirmar">Enviar</button>
    <p>Já tem uma conta?</p><a class="link-login" href="login.html">Fazer Login</a>
</div>
</div>
</section>
</form>
<script src="script.js"></script>
</body>
</html>
