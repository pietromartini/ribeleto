<form id="perfil-form">
<section class="cadastro-all">
<div class="campo-left">
    <p class="cadastro-title">Meu Perfil</p>
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Nome do Usuário</p>
    <input type="text" id="perfil-nome" placeholder="Nome..." class="input-cadastro" required minlength="4">
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Data de Nascimento</p>
    <input type="text" id="perfil-data-nascimento" placeholder="00/00/0000" class="input-cadastro" maxlength="10" required>
    </div>
</div>

<div class="campo-center">
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">CPF</p>
    <input type="text" id="perfil-cpf" placeholder="999.999.999-99" class="input-cadastro" maxlength="14" required>
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">CEP</p>
    <input type="text" id="perfil-cep" placeholder="99999-999" class="input-cadastro" maxlength="9" required>
    </div>
</div>

<div class="campo-right">
    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Telefone</p>
    <input type="text" id="perfil-telefone" placeholder="(99)99999-9999" class="input-cadastro" maxlength="15" required>
    </div>

    <div class="campo-preenchimento">
    <p class="cadastro-categoria">Nova Senha</p>
    <input type="password" id="perfil-senha" placeholder="Nova Senha..." class="input-cadastro" minlength="4">
    <button type="submit" class="btn-confirmar" style="margin-top: 15px;">Salvar</button>
</div>
</div>
</section>
</form>
